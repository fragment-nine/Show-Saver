[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "showsaver"
version = "0.1.0"
description = "Cross-platform live show recording app driven by LTC timecode"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "OPL-1.1"}
dependencies = [
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
compressed = ["PyAV>=12.0"]
video = ["opencv-python>=4.8"]
ndi = ["ndi-python>=5.0"]
osc = ["python-osc>=1.8"]
gui = ["PySide6>=6.6"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
showsaver = "showsaver.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
