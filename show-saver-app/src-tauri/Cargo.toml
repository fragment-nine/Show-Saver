[package]
name = "show-saver"
version = "0.1.0"
edition = "2021"
description = "Cross-platform live show recording app driven by LTC timecode"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
hound = "3.5"
cpal = "0.15"
ringbuf = "0.4"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
dirs = "6"
parking_lot = "0.12"
crossbeam-channel = "0.5"
regex = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
